# Default configuration for NeuroGuard-X
# Adjust paths and hyperparameters as needed.

# Data paths
data_root: "data"
cache_dir: "cache"

# Training parameters
max_epochs: 200
patience: 20
min_delta: 1e-4
warmup_epochs: 5
learning_rate: 1e-3
weight_decay: 1e-5
batch_size: 32

# Model selection (options: gcn, sage, gat, ensemble)
model_type: "sage"

# Feature flags
use_temporal_features: true
use_role_features: true
use_codebert_embeddings: false

# Seed for reproducibility
seed: 42

# Logging
log_dir: "results"

